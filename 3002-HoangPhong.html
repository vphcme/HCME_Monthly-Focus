 let b=DATA.focus.filter(x=>(!$('oa').value||x.asm===$('oa').value)&&(!$('os').value||x.site===$('os').value)),cs=cat?[cat]:CATS;
 let chartBase=b;
 const CHART_LABELS={'HAIR 350G':'HAIR 350G','DOVE HF BT':'DOVE HF BT','COMFORT DÂY':'COMFORT DÂY','SURF 2.9KG':'SURF 2.9KG'};
 function aggregate(rows,name,norm){let t=rows.reduce((q,x)=>q+x.target,0),a=rows.reduce((q,x)=>q+x.actual,0);return {n:name,t,a,v:t?a/t:0,norm}}
 function chartRow(x){return `<div class="barRow"><span class="barLabel" title="${E(x.n)}">${E(x.n)}</span><div class="barTrack"><i class="${x.v>=x.norm?'barGood':'barRisk'}" style="width:${Math.max(0,Math.min(100,x.v*100))}%"></i><em style="left:${Math.max(0,Math.min(100,x.norm*100))}%"></em></div><b class="barPct ${x.v>=x.norm?'pctGood':'pctRisk'}">${P(x.v)}</b></div>`}
 function asmRows(c){let z=chartBase.filter(x=>x.cat===c),norm=z[0]?.norm??DATA.norms[CATS.indexOf(c)];return [...new Set(z.map(x=>x.asm))].sort((a,b)=>a.localeCompare(b,'vi')).map(asm=>aggregate(z.filter(x=>x.asm===asm),asm,norm))}
 let catBars=CATS.map(c=>{let z=chartBase.filter(x=>x.cat===c),norm=z[0]?.norm??DATA.norms[CATS.indexOf(c)];return aggregate(z,CHART_LABELS[c]||c,norm)});
 $('overviewCharts').innerHTML=CATS.map((c,i)=>`<details class="catChart"><summary><span>${E(CHART_LABELS[c]||c)}</span><span class="chartInline">${chartRow(catBars[i])}</span><i>⌄</i></summary><div class="asmChart"><div class="asmHint">Chi tiết theo Group ASM</div>${asmRows(c).map(chartRow).join('')}</div></details>`).join('');
 $('risks').innerHTML=cs.map(c=>{let all=b.filter(x=>x.cat===c&&x.ach<x.norm).sort((a,b)=>a.ach-b.ach),id='r'+c.replace(/\W/g,'');return `<details id="${id}" class="siteRiskGroup"><summary><span>${L(c)}</span><b>${all.length} Site</b></summary>${all.length?all.map(x=>`<article class="riskSimple"><span>${E(x.site)}</span><b>${P(x.ach)}</b></article>`).join(''):'<div class="riskEmpty">Không có Site dưới Norm</div>'}</details>`}).join('');
 $('overview').innerHTML=cs.map(c=>{
  let z=b.filter(x=>x.cat===c),t=z.reduce((q,x)=>q+x.target,0),a=z.reduce((q,x)=>q+x.actual,0),r=t?a/t:0,n=z[0]?.norm??DATA.norms[CATS.indexOf(c)];
  let rows=z.slice().sort((x,y)=>x.asm.localeCompare(y.asm,'vi')||x.site.localeCompare(y.site,'vi'));
  return `<details class="xlBlock siteAccordion ${r>=n?'good':''}"><summary class="xlTitle"><span>${L(c)}</span><span class="siteTotal">${N(a)}/${N(t)} · ${P(r)}</span><small>Norm ${P(n)}</small></summary><div class="siteDetailBody"><div class="xlHead"><span>Site name</span><span>Target</span><span>Actual</span><span>GAP</span><span>% Actual</span></div><div class="xlTotal"><span>Total</span><b>${N(t)}</b><b>${N(a)}</b><b>${N(t-a)}</b><b class="ach">${P(r)}</b></div><div class="xlRows">${rows.map(x=>`<div class="xlRow ${x.ach>=x.norm?'good':''}"><span class="xlSite">${E(x.site)}</span><b>${N(x.target)}</b><b>${N(x.actual)}</b><b>${N(x.target-x.actual)}</b><b class="ach">${P(x.ach)}</b></div>`).join('')}</div></div></details>`
 }).join('')
}
function tog(id,b){let e=$(id),on=e.classList.toggle('expanded');b.textContent=on?'Thu gọn':'+'+e.querySelectorAll('.extra').length+' Site khác'}
function cleanSm(v){return String(v??'').replace(/(?:\s*[-|]\s*)?(?:\+?84|0)\d(?:[ .-]?\d){7,10}\s*$/,'').trim()}
function covColor(v){return v==null?'':v<.5?'covRed':v<.8?'covYellow':'covGreen'}function metricRow(v){return `<div class="metricRow">${CATS.map((c,i)=>`<div class="miniMetric ${covColor(v?v[i]:null)}"><span>${c}</span><b>${P(v?v[i]:null)}</b></div>`).join('')}</div>`}
